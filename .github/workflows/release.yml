name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binary, without the leading v (e.g. 1.2.3). Leave blank to use the project default."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-latest
            name: linux-x64
            rid: linux-x64
            container: ubuntu:22.04
          - os: ubuntu-24.04-arm
            name: linux-arm64
            rid: linux-arm64
            container: ubuntu:22.04
          - os: windows-latest
            name: win-x64
            rid: win-x64
            ext: ".exe"

    steps:
      - name: Prepare container
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git libicu70 clang zlib1g-dev python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.container == ''
        with:
          python-version: "3.12"

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Derive the version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Publish universal macOS binary
        if: matrix.os == 'macos-latest'
        run: |
          set -eux
          ver=""
          if [ -n "${BUILD_VERSION:-}" ]; then ver="-p:Version=${BUILD_VERSION:-}"; fi
          dotnet publish src/LibrariesIreland.Mcp -c Release -r osx-arm64 --no-restore $ver -o out/arm64
          dotnet publish src/LibrariesIreland.Mcp -c Release -r osx-x64 --no-restore $ver -o out/x64
          mkdir -p dist
          lipo -create -output dist/libraries-ireland-mcp \
            out/arm64/libraries-ireland-mcp \
            out/x64/libraries-ireland-mcp
          codesign -s - dist/libraries-ireland-mcp
          lipo -archs dist/libraries-ireland-mcp

      - name: Publish binary
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -eux
          ver=""
          if [ -n "${BUILD_VERSION:-}" ]; then ver="-p:Version=${BUILD_VERSION:-}"; fi
          dotnet publish src/LibrariesIreland.Mcp -c Release -r ${{ matrix.rid }} --no-restore $ver -o dist


      - name: Check the MCP handshake
        run: python3 scripts/mcp-handshake.py dist/libraries-ireland-mcp${{ matrix.ext }}
        shell: bash

      - name: Record the glibc baseline
        if: matrix.container != ''
        run: |
          ldd --version | head -1
          objdump -T dist/libraries-ireland-mcp 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -5 || true

      - name: Name the artefact and checksum it
        shell: bash
        run: |
          set -eux
          mkdir -p release
          asset="libraries-ireland-mcp-${{ matrix.name }}${{ matrix.ext }}"
          cp "dist/libraries-ireland-mcp${{ matrix.ext }}" "release/${asset}"
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi
          ls -la

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -laR artifacts

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/libraries-ireland-mcp-*"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
